<title>Đồng hồ bàn học</title>
<style>

  html,body { height:100%; }
  body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
         background:#000; color:#fff; overflow:hidden;
         display:flex; flex-direction:column; height:100%; }

  td.dim { color:#3a3a3f; }

<body>
  <div id="main">
    <div id="clockwrap"><canvas id="clock" width="264" height="264"></canvas></div>

<script>
var PI = Math.PI;
function jdFromDate(dd, mm, yy) {
  var a = Math.floor((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
  var jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
  if (jd < 2299161) jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - 32083;
  return jd;
}
function getNewMoonDay(k, tz) {
  var T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = PI / 180;
  var Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3 + 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
  var M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
  var Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
  var F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
  var C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M) - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(2 * dr * Mpr) - 0.0004 * Math.sin(3 * dr * Mpr) + 0.0104 * Math.sin(2 * dr * F) - 0.0051 * Math.sin(dr * (M + Mpr)) - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M)) - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr)) + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
  var dt = (T < -11) ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3 : -0.000278 + 0.000265 * T + 0.000262 * T2;
  return Math.floor(Jd1 + C1 - dt + 0.5 + tz / 24);
}
function getSunLongitude(jdn, tz) {
  var T = (jdn - 2451545.5 - tz / 24) / 36525, T2 = T * T, dr = PI / 180;
  var M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
  var L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
  var DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M) + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
  var L = (L0 + DL) * dr; L = L - PI * 2 * Math.floor(L / (PI * 2));
  return Math.floor(L / PI * 6);
}
function getLunarMonth11(yy, tz) {
  var k = Math.floor((jdFromDate(31, 12, yy) - 2415021) / 29.530588853);
  var nm = getNewMoonDay(k, tz), sunLong = getSunLongitude(nm, tz);
  if (sunLong >= 9) nm = getNewMoonDay(k - 1, tz);
  return nm;
}
function getLeapMonthOffset(a11, tz) {
  var k = Math.floor((a11 - 2415021.076998695) / 29.530588853 + 0.5);
  var last = 0, i = 1, arc = getSunLongitude(getNewMoonDay(k + i, tz), tz);
  do { last = arc; i++; arc = getSunLongitude(getNewMoonDay(k + i, tz), tz); } while (arc != last && i < 14);
  return i - 1;
}
function convertSolar2Lunar(dd, mm, yy, tz) {
  var dayNumber = jdFromDate(dd, mm, yy), k = Math.floor((dayNumber - 2415021.076998695) / 29.530588853);
  var monthStart = getNewMoonDay(k + 1, tz);
  if (monthStart > dayNumber) monthStart = getNewMoonDay(k, tz);
  var a11 = getLunarMonth11(yy, tz), b11 = a11, lunarYear, lunarMonth, lunarDay = dayNumber - monthStart + 1, diff, leap, lunarLeap;
  if (a11 >= monthStart) { lunarYear = yy; a11 = getLunarMonth11(yy - 1, tz); }
  else { lunarYear = yy + 1; b11 = getLunarMonth11(yy + 1, tz); }
  diff = Math.floor((monthStart - a11) / 29); lunarLeap = 0; lunarMonth = diff + 11;
  if (b11 - a11 > 365) {
    leap = getLeapMonthOffset(a11, tz);
    if (diff >= leap) { lunarMonth = diff + 10; if (diff == leap) lunarLeap = 1; }
  }
  if (lunarMonth > 12) lunarMonth -= 12;
  if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;
  return [lunarDay, lunarMonth, lunarYear, lunarLeap];
}
/* ===== Can Chi ===== */
var CAN = ["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
var CHI = ["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];
function canChiYear(y) { return CAN[(y + 6) % 10] + " " + CHI[(y + 8) % 12]; }
function canChiMonth(lunarYear, lunarMonth) {
  var yStem = (lunarYear + 6) % 10;
  var danStem = (yStem * 2 + 2) % 10;
  var stem = (danStem + lunarMonth - 1) % 10;
  var branch = (2 + lunarMonth - 1) % 12;
  return CAN[stem] + " " + CHI[branch];
}

var QUOTES = ["Học hôm nay, gặt hái ngày mai", "Tri thức là chìa khóa mở cửa tương lai", "Không có đường tắt nào đến thành công", "Mỗi ngày học một chút, một năm giỏi rất nhiều", "Tương lai thuộc về người chịu học hôm nay", "Học không phải để hơn ai, mà để hơn chính mình hôm qua", "Ước mơ không tự thành hiện thực, phải học mới thành", "Cố gắng hôm nay, tự hào ngày mai", "Đọc thêm một trang sách, mở rộng thêm một chân trời", "Người giỏi không phải bẩm sinh, họ chỉ chăm chỉ hơn", "Thất bại chỉ là một bài học chưa thuộc bài", "Đừng sợ đi chậm, chỉ sợ đứng yên", "Kỷ luật hôm nay, tự do ngày mai", "Học hành là khoản đầu tư có lãi nhất đời người", "Muốn đi thật xa, phải học vững từ hôm nay", "Điểm số không định nghĩa con người, thái độ học mới định nghĩa tương lai", "Mỗi bài toán khó là một bậc thang đi lên", "Hôm nay lười một giờ, ngày mai vất vả gấp đôi", "Sách là người bạn không bao giờ phản bội", "Học để hiểu đời, học để đổi đời", "Thành công mỉm cười với người dậy sớm và chăm chỉ", "Chữ hôm nay học, cơm ngày mai ăn", "Không thầy đố mày làm nên — hãy trân trọng thầy cô", "Hỏi một câu chỉ dốt một lúc, không hỏi dốt cả đời", "Học thầy, học bạn, học cả từ sai lầm", "Việc học như chèo thuyền ngược nước, không tiến ắt lùi", "Có công mài sắt, có ngày nên kim", "Kiến tha lâu cũng đầy tổ — học đều mỗi ngày là thắng", "Chậm mà chắc còn hơn nhanh mà hỏng", "Học một biết mười, suy nghĩ sâu mới giỏi", "Muốn biết phải hỏi, muốn giỏi phải học", "Đầu tư vào tri thức luôn sinh lời cao nhất", "Giáo dục là vũ khí mạnh nhất để thay đổi thế giới", "Người ta có thể lấy đi mọi thứ, trừ tri thức trong đầu bạn", "Học vấn là tài sản không ai cướp được", "Một giờ học chăm chỉ bằng một ngày mơ ước suông", "Đừng đợi có hứng mới học, học rồi hứng sẽ đến", "Việc khó nhất là bắt đầu — cứ mở sách ra trước đã", "Hôm nay đọc sách, ngày mai viết nên tương lai", "Tiếng Anh hôm nay, cánh cửa thế giới ngày mai", "Ngoại ngữ là chiếc vé đi khắp năm châu", "Toán học rèn cái đầu lạnh và trái tim nóng", "Văn học nuôi tâm hồn, khoa học mở trí tuệ", "Mỗi môn học là một mảnh ghép của tương lai", "Đừng học vẹt, hãy học để hiểu", "Hiểu một điều sâu hơn thuộc mười điều nông", "Sai thì sửa, ngã thì đứng dậy học tiếp", "Người thành công từng là học trò chăm chỉ", "Ước mơ lớn bắt đầu từ bài học nhỏ hôm nay", "Hãy học như thể ngày mai là ngày thi — mỗi ngày", "Thời gian học là thời gian không bao giờ phí", "Bạn bè tốt là bạn bè rủ nhau cùng tiến bộ", "Chơi có giờ, học có lúc — cân bằng là giỏi nhất", "Điện thoại để sau, sách vở để trước", "Một năm sau bạn sẽ ước mình bắt đầu từ hôm nay", "Đừng so mình với bạn, hãy so mình với hôm qua", "Giỏi giang là kết quả của ngàn giờ âm thầm cố gắng", "Tài năng không bằng cần cù", "Thông minh là món quà, chăm chỉ là lựa chọn", "Chọn chăm chỉ hôm nay, chọn tương lai sáng ngày mai", "Cha mẹ cho hình hài, thầy cô cho tri thức, bản thân cho tương lai", "Công cha nghĩa mẹ ơn thầy — học giỏi là cách đền đáp đẹp nhất", "Học cho mình trước hết, rồi mới cho gia đình tự hào", "Con đường học vấn không trải hoa hồng, nhưng đích đến rất đẹp", "Mỗi trang vở sạch đẹp là một ngày nghiêm túc với tương lai", "Viết chữ nắn nót, làm người cẩn thận", "Nét chữ là nết người", "Học ăn học nói, học gói học mở", "Lễ phép và chăm học — hai thứ khiến ai cũng quý", "Người học trò tốt hôm nay là công dân tốt ngày mai", "Đất nước cần người tài, gia đình cần người chăm", "Hãy để tương lai cảm ơn bạn của ngày hôm nay", "Ba mươi phút tập trung hơn ba giờ ngồi mơ màng", "Ngủ đủ, ăn đủ, học mới vào đầu", "Đôi mắt quý như vàng — học xong nhớ cho mắt nghỉ ngơi", "Nhìn xa 6 mét sau mỗi 20 phút đọc sách, mắt sẽ cảm ơn bạn", "Thể dục khỏe người, đọc sách khỏe trí", "Một cơ thể khỏe là nền của một cái đầu sáng", "Ngày mới, cơ hội mới để học thêm điều hay", "Hôm nay là ngày trẻ nhất của phần đời còn lại — học ngay thôi", "Đừng để ngày mai phải nói hai chữ giá như", "Cơ hội chỉ đến với người đã chuẩn bị", "Chuẩn bị bài hôm nay, tự tin ngày mai", "Tự tin đến từ việc đã học bài đàng hoàng function pad(n) { return (n < 10 ? "0" : "") + n; }
/* ===== Analog clock (canvas) ===== */
function drawClock() {
  var cv = document.getElementById("clock"), ctx = cv.getContext("2d");
  var W = 264, C = W / 2, R = C - 6;
  var now = new Date();
  ctx.clearRect(0, 0, W, W);
  /* minute ticks */
  for (var i = 0; i < 60; i++) {
    var a = i * Math.PI / 30, big = (i % 5 === 0);
    var r1 = R - (big ? 13 : 7), r2 = R;
    ctx.beginPath();
    ctx.moveTo(C + r1 * Math.sin(a), C - r1 * Math.cos(a));
    ctx.lineTo(C + r2 * Math.sin(a), C - r2 * Math.cos(a));
    ctx.lineWidth = big ? 3.5 : 1.8;
    ctx.strokeStyle = big ? "#ffffff" : "#6e6e73";
    ctx.stroke();
  }
  /* numbers */
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 25px -apple-system, Arial";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (var n = 1; n <= 12; n++) {
    var an = n * Math.PI / 6, rr = R - 30;
    ctx.fillText("" + n, C + rr * Math.sin(an), C - rr * Math.cos(an) + 1);
  }
  var s = now.getSeconds() + now.getMilliseconds() / 1000;
  var m = now.getMinutes() + s / 60;
  var h = (now.getHours() % 12) + m / 60;
  function hand(angle, len, width, color) {
    ctx.beginPath();
    ctx.moveTo(C - 14 * Math.sin(angle), C + 14 * Math.cos(angle));
    ctx.lineTo(C + len * Math.sin(angle), C - len * Math.cos(angle));
    ctx.lineWidth = width; ctx.lineCap = "round"; ctx.strokeStyle = color; ctx.stroke();
  }
  hand(h * Math.PI / 6, R * 0.52, 8, "#ffffff");
  hand(m * Math.PI / 30, R * 0.78, 5.5, "#ffffff");
  hand(s * Math.PI / 30, R * 0.88, 2.2, "#ff9500");
  ctx.beginPath(); ctx.arc(C, C, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = "#ff9500"; ctx.fill();
  ctx.beginPath(); ctx.arc(C, C, 2.4, 0, Math.PI * 2);
  ctx.fillStyle = "#000"; ctx.fill();
}
/* ===== Month grid + lunar + quote ===== */
var lastDay = -1;
function renderDay() {
  var now = new Date();
  if (now.getDate() === lastDay) return;
  lastDay = now.getDate();
  var y = now.getFullYear(), mo = now.getMonth(), today = now.getDate();
  document.getElementById("month").innerHTML = "THÁNG " + (mo + 1) + " · " + y;
  var first = new Date(y, mo, 1);
  var lead = (first.getDay() + 6) % 7; /* Monday first */
  var days = new Date(y, mo + 1, 0).getDate();
  var prevDays = new Date(y, mo, 0).getDate();
  var heads = ["T2","T3","T4","T5","T6","T7","CN"];
  var html = "<tr>";
  for (var h = 0; h < 7; h++) html += '<th class="' + (h === 6 ? "sun" : "") + '">' + heads[h] + "</th>";
  html += "</tr><tr>";
  var cell = 0, d, cls;
  for (var i = 0; i < lead; i++) { html += '<td class="dim">' + (prevDays - lead + 1 + i) + "</td>"; cell++; }
  for (d = 1; d <= days; d++) {
    if (cell === 7) { html += "</tr><tr>"; cell = 0; }
    html += "<td>" + (d === today ? '<span class="today">' + d + "</span>" : d) + "</td>";
    cell++;
  }
  var nd = 1;
  while (cell < 7) { html += '<td class="dim">' + nd + "</td>"; nd++; cell++; }
  html += "</tr>";
  document.getElementById("grid").innerHTML = html;
  var l = convertSolar2Lunar(today, mo + 1, y, 7);
  document.getElementById("lunar").innerHTML = "🌙 Âm lịch " + l[0] + "/" + l[1] + (l[3] ? " nhuận" : "") + " · Năm " + canChiYear(l[2]);
  var start = new Date(y, 0, 0);
  var doy = Math.floor((now - start) / 86400000);
  document.getElementById("quote").innerHTML = "“" + QUOTES[(doy - 1) % QUOTES.length] + "”";
}
drawClock(); renderDay();
setInterval(function(){ drawClock(); renderDay(); }, 1000);
setTimeout(function(){ location.reload(); }, 6 * 60 * 60 * 1000);
</script>
