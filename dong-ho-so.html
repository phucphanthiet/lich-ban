<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Đồng hồ số — bàn học</title>
<link href="https://fonts.googleapis.com/css?family=Baloo+2:700,800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
         background:#000; color:#fff; overflow:hidden;
         display:flex; flex-direction:column; height:100%;
         align-items:center; justify-content:space-between; }
  #date { font-size:18px; font-weight:700; color:#c9c9ce; letter-spacing:1px; padding-top:7px; }
  #date .d { color:#ff5a3c; }
  #clock { font-family:"Baloo 2",-apple-system,sans-serif; font-weight:800;
           font-size:140px; line-height:1.0; letter-spacing:-6px;
           transform:scale(0.96,1.9); color:#ffffff; margin:0;
           white-space:nowrap; }
  #clock .sec { color:#ff9500; }
  #clock .colon { color:#8e8e93; }
  #quote { font-size:19px; font-weight:600; font-style:italic; color:#c9c9ce;
           text-align:center; padding:0 26px 7px 26px; line-height:1.3; }
</style>
</head>
<body>
  <div id="date">—</div>
  <div id="clock">--:--:--</div>
  <div id="quote"></div>
<script>
var QUOTES = ["Học hôm nay, gặt hái ngày mai", "Tri thức là chìa khóa mở cửa tương lai", "Không có đường tắt nào đến thành công", "Mỗi ngày học một chút, một năm giỏi rất nhiều", "Tương lai thuộc về người chịu học hôm nay", "Học không phải để hơn ai, mà để hơn chính mình hôm qua", "Ước mơ không tự thành hiện thực, phải học mới thành", "Cố gắng hôm nay, tự hào ngày mai", "Đọc thêm một trang sách, mở rộng thêm một chân trời", "Người giỏi không phải bẩm sinh, họ chỉ chăm chỉ hơn", "Thất bại chỉ là một bài học chưa thuộc bài", "Đừng sợ đi chậm, chỉ sợ đứng yên", "Kỷ luật hôm nay, tự do ngày mai", "Học hành là khoản đầu tư có lãi nhất đời người", "Muốn đi thật xa, phải học vững từ hôm nay", "Điểm số không định nghĩa con người, thái độ học mới định nghĩa tương lai", "Mỗi bài toán khó là một bậc thang đi lên", "Hôm nay lười một giờ, ngày mai vất vả gấp đôi", "Sách là người bạn không bao giờ phản bội", "Học để hiểu đời, học để đổi đời", "Thành công mỉm cười với người dậy sớm và chăm chỉ", "Chữ hôm nay học, cơm ngày mai ăn", "Không thầy đố mày làm nên — hãy trân trọng thầy cô", "Hỏi một câu chỉ dốt một lúc, không hỏi dốt cả đời", "Học thầy, học bạn, học cả từ sai lầm", "Việc học như chèo thuyền ngược nước, không tiến ắt lùi", "Có công mài sắt, có ngày nên kim", "Kiến tha lâu cũng đầy tổ — học đều mỗi ngày là thắng", "Chậm mà chắc còn hơn nhanh mà hỏng", "Học một biết mười, suy nghĩ sâu mới giỏi", "Muốn biết phải hỏi, muốn giỏi phải học", "Đầu tư vào tri thức luôn sinh lời cao nhất", "Giáo dục là vũ khí mạnh nhất để thay đổi thế giới", "Người ta có thể lấy đi mọi thứ, trừ tri thức trong đầu bạn", "Học vấn là tài sản không ai cướp được", "Một giờ học chăm chỉ bằng một ngày mơ ước suông", "Đừng đợi có hứng mới học, học rồi hứng sẽ đến", "Việc khó nhất là bắt đầu — cứ mở sách ra trước đã", "Hôm nay đọc sách, ngày mai viết nên tương lai", "Tiếng Anh hôm nay, cánh cửa thế giới ngày mai", "Ngoại ngữ là chiếc vé đi khắp năm châu", "Toán học rèn cái đầu lạnh và trái tim nóng", "Văn học nuôi tâm hồn, khoa học mở trí tuệ", "Mỗi môn học là một mảnh ghép của tương lai", "Đừng học vẹt, hãy học để hiểu", "Hiểu một điều sâu hơn thuộc mười điều nông", "Sai thì sửa, ngã thì đứng dậy học tiếp", "Người thành công từng là học trò chăm chỉ", "Ước mơ lớn bắt đầu từ bài học nhỏ hôm nay", "Hãy học như thể ngày mai là ngày thi — mỗi ngày", "Thời gian học là thời gian không bao giờ phí", "Bạn bè tốt là bạn bè rủ nhau cùng tiến bộ", "Chơi có giờ, học có lúc — cân bằng là giỏi nhất", "Điện thoại để sau, sách vở để trước", "Một năm sau bạn sẽ ước mình bắt đầu từ hôm nay", "Đừng so mình với bạn, hãy so mình với hôm qua", "Giỏi giang là kết quả của ngàn giờ âm thầm cố gắng", "Tài năng không bằng cần cù", "Thông minh là món quà, chăm chỉ là lựa chọn", "Chọn chăm chỉ hôm nay, chọn tương lai sáng ngày mai", "Cha mẹ cho hình hài, thầy cô cho tri thức, bản thân cho tương lai", "Công cha nghĩa mẹ ơn thầy — học giỏi là cách đền đáp đẹp nhất", "Học cho mình trước hết, rồi mới cho gia đình tự hào", "Con đường học vấn không trải hoa hồng, nhưng đích đến rất đẹp", "Mỗi trang vở sạch đẹp là một ngày nghiêm túc với tương lai", "Viết chữ nắn nót, làm người cẩn thận", "Nét chữ là nết người", "Học ăn học nói, học gói học mở", "Lễ phép và chăm học — hai thứ khiến ai cũng quý", "Người học trò tốt hôm nay là công dân tốt ngày mai", "Đất nước cần người tài, gia đình cần người chăm", "Hãy để tương lai cảm ơn bạn của ngày hôm nay", "Ba mươi phút tập trung hơn ba giờ ngồi mơ màng", "Ngủ đủ, ăn đủ, học mới vào đầu", "Đôi mắt quý như vàng — học xong nhớ cho mắt nghỉ ngơi", "Nhìn xa 6 mét sau mỗi 20 phút đọc sách, mắt sẽ cảm ơn bạn", "Thể dục khỏe người, đọc sách khỏe trí", "Một cơ thể khỏe là nền của một cái đầu sáng", "Ngày mới, cơ hội mới để học thêm điều hay", "Hôm nay là ngày trẻ nhất của phần đời còn lại — học ngay thôi", "Đừng để ngày mai phải nói hai chữ giá như", "Cơ hội chỉ đến với người đã chuẩn bị", "Chuẩn bị bài hôm nay, tự tin ngày mai", "Tự tin đến từ việc đã học bài đàng hoàng", "Thi cử chỉ đáng sợ khi mình chưa ôn", "Ôn đều mỗi ngày, thi đến nhẹ như chơi", "Mục tiêu nhỏ mỗi ngày, thành tích lớn cuối năm", "Viết mục tiêu ra giấy, dán lên bàn học, nhìn mỗi ngày", "Ước mơ không có deadline chỉ là mơ mộng", "Hãy biến ước mơ thành kế hoạch, kế hoạch thành việc hôm nay", "Tương lai của bạn được quyết định bởi việc bạn làm hôm nay"];
var DOW = ["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
function pad(n) { return (n < 10 ? "0" : "") + n; }
var lastDay = -1;
function render() {
  var now = new Date();
  document.getElementById("clock").innerHTML =
    pad(now.getHours()) + '<span class="colon">:</span>' + pad(now.getMinutes()) +
    '<span class="colon">:</span><span class="sec">' + pad(now.getSeconds()) + "</span>";
  if (now.getDate() !== lastDay) {
    lastDay = now.getDate();
    document.getElementById("date").innerHTML =
      DOW[now.getDay()] + ' · <span class="d">' + pad(now.getDate()) + "/" + pad(now.getMonth() + 1) +
      "</span>/" + now.getFullYear();
    var start = new Date(now.getFullYear(), 0, 0);
    var doy = Math.floor((now - start) / 86400000);
    document.getElementById("quote").innerHTML = "“" + QUOTES[(doy - 1) % QUOTES.length] + "”";
  }
}
render();
setInterval(render, 250);
setTimeout(function(){ location.reload(); }, 6 * 60 * 60 * 1000);
</script>
</body>
</html>
